name: 打包并发布 Windows 安装包

# 用法：把版本号写进 package.json 的 version，提交后打标签推上去即可
#   git tag v3.1.0 && git push origin v3.1.0
# 也可以在 GitHub 网页 → Actions → 本工作流 → Run workflow 手动触发

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install --no-audit --no-fund --legacy-peer-deps

      # 分发包内置发件邮箱：别人装完本机没有 SMTP，注册会卡在"发件邮箱未配置"。
      # 授权码只存在仓库 Secrets 里（加密），不会出现在代码和构建日志中。
      # 没配置这几个 secret 时生成空值 → 打包照常，只是不含内置邮箱。
      - name: 注入内置发件邮箱
        shell: bash
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          cat > src/main/utils/smtp-preset.local.ts <<'EOF'
          export const SMTP_PRESET = {
            host: '$SMTP_HOST',
            port: '$SMTP_PORT',
            user: '$SMTP_USER',
            pass: '$SMTP_PASS',
          };
          EOF
          echo "已注入内置发件邮箱配置"

      - name: 构建渲染层
        run: npm run build:renderer

      - name: 构建主进程
        # 项目存在历史类型告警，这里不让 tsc 的退出码中断打包
        run: npx tsc -p tsconfig.main.json || echo "tsc 有类型告警，继续打包"

      - name: 打包安装包
        run: npx electron-builder --win --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 注意：这里**不要**设 ELECTRON_BUILDER_BINARIES_MIRROR。
          # 那个 npmmirror 镜像是给国内本机打包用的；GitHub Actions 在海外，
          # 走 npmmirror 反而慢到超时（v3.1.0 首次构建就是卡死在这一步），
          # 让它用默认的 GitHub 源下载即可。

      - name: 生成校验值
        shell: bash
        run: |
          cd release
          ls -l *.exe
          sha256sum *.exe > sha256.txt
          cat sha256.txt

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/sha256.txt
          generate_release_notes: true
